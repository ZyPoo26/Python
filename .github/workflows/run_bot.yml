name: BIST Otomatik Analiz Motoru

on:
  schedule:
    # Hafta içi (Pzt–Cuma) her saatin 15. dakikası. GitHub UTC kullanır:
    # TR 10:15–17:15 = UTC 07:15–14:15
    # NOT: 0. dakika GitHub'da en yoğun an olduğu için 15. dakika seçildi
    # (daha güvenilir tetiklenir). Yine de cron ±10-30 dk gecikebilir.
    - cron: '15 7-14 * * 1-5'
  workflow_dispatch: # Web arayüzünden manuel "Run workflow" butonu

# Repoya artık bir şey yazılmıyor; hafıza Actions cache'inde tutuluyor.
permissions:
  contents: read

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul   # Tarih/saat damgaları Türkiye saatiyle olsun
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Opsiyonel: AI raporu için (tanımlı değilse bot yine çalışır)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
    - name: Repo Kodlarını Çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: borsa_analiz/requirements.txt

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r borsa_analiz/requirements.txt

    # Sinyal hafızası (aynı sinyali tekrar göndermemek için) ve haber takibine
    # eklenen hisseler, repoya commit EDİLMEZ — GitHub Actions cache'inde saklanır.
    # Her çalıştırma en son kaydı geri yükler, bitince yenisini kaydeder.
    - name: Hafızayı Geri Yükle
      uses: actions/cache/restore@v4
      with:
        path: |
          borsa_analiz/sent_state_BIST.json
          borsa_analiz/watch_flags_BIST.json
        key: scan-BIST-${{ github.run_id }}
        restore-keys: scan-BIST-

    - name: Analiz Algoritmasını Tetikle
      run: |
        cd borsa_analiz
        python main.py --once

    - name: Hafıza Dosyalarını Hazırla
      if: always()
      run: |
        for f in borsa_analiz/sent_state_BIST.json borsa_analiz/watch_flags_BIST.json; do
          [ -f "$f" ] || echo '{}' > "$f"
        done

    - name: Hafızayı Kaydet
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          borsa_analiz/sent_state_BIST.json
          borsa_analiz/watch_flags_BIST.json
        key: scan-BIST-${{ github.run_id }}
