name: Anlık Haber Takibi

on:
  schedule:
    # Her gün 20 dakikada bir, TR 08:00–23:40 arası (UTC 05–20).
    # Sadece ÖNEMLİ haberler bildirilir; tekrar ve spam news_state_*.json ile önlenir.
    # Not: GitHub cron garantili değildir, yoğunlukta birkaç dakika gecikebilir.
    - cron: '*/20 5-20 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Üst üste binen çalıştırmalar aynı haberi iki kez göndermesin
concurrency:
  group: news-watch
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
    - name: Repo Kodlarını Çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: borsa_analiz/requirements.txt

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r borsa_analiz/requirements.txt

    - name: BIST Haberlerini Kontrol Et
      continue-on-error: true
      run: |
        cd borsa_analiz
        python main.py --news

    - name: ABD Haberlerini Kontrol Et
      continue-on-error: true
      env:
        MARKET: US
      run: |
        cd borsa_analiz
        python main.py --news

    - name: Haber Hafızasını Kaydet
      continue-on-error: true
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # Sadece var olan dosyaları ekle (git add, eksik dosyada hepsini reddeder)
        for f in borsa_analiz/news_state_BIST.json borsa_analiz/news_state_US.json; do
          if [ -f "$f" ]; then git add "$f"; fi
        done
        if git diff --staged --quiet; then
          echo "Hafızada değişiklik yok."
        else
          git commit -m "Haber hafızası güncellendi [skip ci]"
          git pull --rebase origin main || true
          git push || echo "Push başarısız, atlandı."
        fi
