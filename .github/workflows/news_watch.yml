name: Anlık Haber Takibi

on:
  schedule:
    # Her gün 20 dakikada bir, TR 08:00–23:40 arası (UTC 05–20).
    # Sadece ÖNEMLİ haberler bildirilir; tekrar ve spam news_state_*.json ile önlenir.
    # Not: GitHub cron garantili değildir, yoğunlukta birkaç dakika gecikebilir.
    - cron: '*/20 5-20 * * *'
  workflow_dispatch:

# Repoya artık bir şey yazılmıyor; hafıza Actions cache'inde tutuluyor.
permissions:
  contents: read

# Üst üste binen çalıştırmalar aynı haberi iki kez göndermesin
concurrency:
  group: news-watch
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
    - name: Repo Kodlarını Çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: borsa_analiz/requirements.txt

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r borsa_analiz/requirements.txt

    # Gönderilmiş haberlerin hafızası (tekrar göndermemek için)
    - name: Haber Hafızasını Geri Yükle
      uses: actions/cache/restore@v4
      with:
        path: |
          borsa_analiz/news_state_BIST.json
          borsa_analiz/news_state_US.json
        key: news-${{ github.run_id }}
        restore-keys: news-

    # Taramaların öne çıkardığı hisseler (sadece okunur, tarama iş akışları yazar)
    - name: BIST Takip Listesini Al
      uses: actions/cache/restore@v4
      with:
        path: |
          borsa_analiz/sent_state_BIST.json
          borsa_analiz/watch_flags_BIST.json
        key: scan-BIST-none
        restore-keys: scan-BIST-

    - name: ABD Takip Listesini Al
      uses: actions/cache/restore@v4
      with:
        path: |
          borsa_analiz/sent_state_US.json
          borsa_analiz/watch_flags_US.json
        key: scan-US-none
        restore-keys: scan-US-

    - name: BIST Haberlerini Kontrol Et
      continue-on-error: true
      run: |
        cd borsa_analiz
        python main.py --news

    - name: ABD Haberlerini Kontrol Et
      continue-on-error: true
      env:
        MARKET: US
      run: |
        cd borsa_analiz
        python main.py --news

    - name: Hafıza Dosyalarını Hazırla
      if: always()
      run: |
        for f in borsa_analiz/news_state_BIST.json borsa_analiz/news_state_US.json; do
          [ -f "$f" ] || echo '{}' > "$f"
        done

    - name: Haber Hafızasını Kaydet
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          borsa_analiz/news_state_BIST.json
          borsa_analiz/news_state_US.json
        key: news-${{ github.run_id }}
