name: ABD (S&P500) Otomatik Analiz Motoru

on:
  schedule:
    # ABD borsası (NYSE/NASDAQ) seansı: ET 09:30–16:00.
    # GitHub UTC kullanır. Yaz saati (EDT): UTC 13:30–20:00, kış (EST): 14:30–21:00.
    # Her iki sezonu kapsamak için UTC 13:00–21:00 arası her saatin 15. dakikası.
    - cron: '15 13-21 * * 1-5'
  workflow_dispatch: # Web arayüzünden manuel "Run workflow" butonu

# Repoya artık bir şey yazılmıyor; hafıza Actions cache'inde tutuluyor.
permissions:
  contents: read

jobs:
  run-analysis-us:
    runs-on: ubuntu-latest
    env:
      MARKET: US                 # ← ABD moduna geçiren anahtar
      TZ: Europe/Istanbul   # Tarih/saat damgaları Türkiye saatiyle olsun
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Opsiyonel: AI raporu için (tanımlı değilse bot yine çalışır)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
    - name: Repo Kodlarını Çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: borsa_analiz/requirements.txt

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r borsa_analiz/requirements.txt

    # Sinyal hafızası (aynı sinyali tekrar göndermemek için) ve haber takibine
    # eklenen hisseler, repoya commit EDİLMEZ — GitHub Actions cache'inde saklanır.
    # Her çalıştırma en son kaydı geri yükler, bitince yenisini kaydeder.
    - name: Hafızayı Geri Yükle
      uses: actions/cache/restore@v4
      with:
        path: |
          borsa_analiz/sent_state_US.json
          borsa_analiz/watch_flags_US.json
        key: scan-US-${{ github.run_id }}
        restore-keys: scan-US-

    - name: ABD Analizini Tetikle
      run: |
        cd borsa_analiz
        python main.py --once

    - name: Hafıza Dosyalarını Hazırla
      if: always()
      run: |
        for f in borsa_analiz/sent_state_US.json borsa_analiz/watch_flags_US.json; do
          [ -f "$f" ] || echo '{}' > "$f"
        done

    - name: Hafızayı Kaydet
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          borsa_analiz/sent_state_US.json
          borsa_analiz/watch_flags_US.json
        key: scan-US-${{ github.run_id }}
